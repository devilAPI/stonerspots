# Stonerspots API configuration.
#
#   cp config.example.yaml config.yaml   # config.yaml is git-ignored
#
# The API reads ./config.yaml (or the file named by $CONFIG_FILE). Every key is
# optional; environment variables (in brackets) override the file, and missing
# values fall back to the local dev defaults shown here.

# Address to listen on [ADDR]. On a server the API listens on localhost only
# and a reverse proxy (Caddy, nginx) on the same machine serves it over HTTPS
# (see the README). ":8080" (all interfaces, also the default when this key
# is missing) lets other machines connect directly, e.g. a phone in the LAN
# during development; never forward that port to the internet.
addr: "127.0.0.1:8080"

# Public HTTPS origin of this server, used for absolute photo URLs [PUBLIC_BASE_URL]
public_base_url: "http://localhost:8080"

# Browser origins the web app may call the API from (CORS) [ALLOWED_ORIGINS, comma-separated]
allowed_origins:
  - "https://devilapi.github.io"

# Secret that signs login tokens: whoever knows it can log in as anyone.
# Required, at least 32 characters, e.g. `openssl rand -hex 32`. The API
# refuses to start with this example value unless public_base_url is
# localhost [JWT_SECRET]
jwt_secret: "change-me"

# Where uploaded photos are stored [UPLOAD_DIR]
upload_dir: "./uploads"

# Folder with the SQL migrations; applied on every start [MIGRATIONS_DIR]
migrations_dir: "./migrations"

# Folder through which the admin page asks for a backend update. Set by the
# systemd unit of install-backend.sh; empty turns the update buttons off
# [UPDATE_DIR]
update_dir: ""

# Nominatim-compatible geocoder [GEOCODER_URL]
geocoder_url: "https://nominatim.openstreetmap.org"

# Reverse proxies (IPs or CIDR ranges) whose X-Forwarded-For header is
# trusted to name the client. Rate limits work per client IP:
#   - proxy on the same machine (addr on 127.0.0.1): its loopback addresses,
#     as below. Left empty, every client looks like the proxy and all of them
#     share one rate limit (one script locks everybody out of logging in).
#   - proxy on another machine: its LAN address, e.g. ["192.168.1.2"].
#   - no proxy, clients connect directly: [] (never list addresses clients
#     connect from, or they can fake their IP with the header).
# [TRUSTED_PROXIES, comma-separated]
trusted_proxies: ["127.0.0.1/32", "::1/128"]

# Rate limits (N requests per period). All periods are duration strings like "1m", "1h".
# Zero disables the limit. Override via env vars with the same names in uppercase.
limits:
  per_ip:         { n: 600, per: "1m" }   # every request, per client IP
  login:          { n: 10,  per: "1m" }   # login attempts per IP
  login_failures: { n: 20,  per: "1h" }   # wrong passwords per account (email)
  register:       { n: 5,   per: "1h" }   # new accounts per IP
  refresh:        { n: 30,  per: "1m" }   # token refreshes per IP
  uploads:        { n: 30,  per: "1h" }   # photo uploads per user
  spots_per_day:     10   # new spots per user per day (0 = unlimited)
  updates_per_day:   50   # spot updates per user per day (0 = unlimited)
  reviews_per_day:   20   # reviews per user per day (0 = unlimited)
  reports_per_day:   10   # reports per user per day (0 = unlimited)
  comments_per_day: 100   # comments under updates per user per day (0 = unlimited)
  forgot_password:       { n: 10, per: "1h" }  # password reset requests per IP
  forgot_password_email: { n: 3,  per: "1h" }  # reset mails per address (more get the same answer, but no mail)
  search:                { n: 60, per: "1m" }  # GET /spots/search and GET /feed per IP
  follows_per_day:  200   # new follows per user per day (0 = unlimited)
  likes_per_day:    300   # likes per user per day (0 = unlimited)

# Global request body size limit as a safety net (bytes). Per-handler limits
# still apply (e.g. 8 MB for photo uploads). Default 10 MB [MAX_BODY_BYTES].
max_body_bytes: 10485760

# SMTP for transactional mail (verification, password reset). Optional:
# leave empty to disable mail features entirely. The server must offer TLS
# (STARTTLS on 587, or TLS on 465) with a valid certificate: nothing is sent
# in plain text. With a username the API logs in with AUTH PLAIN.
# With mail on, new accounts must verify their address before logging in
# [MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD, MAIL_FROM]
mail:
  host: ""           # e.g. smtp.example.com
  port: 587          # 587 (STARTTLS) or 465 (TLS)
  username: ""       # SMTP auth username
  password: ""       # SMTP auth password
  from: ""           # e.g. "Stonerspots <noreply@example.com>"

# Where users open the app; the links in verification and reset mails start
# with it (<app_base_url>/verify-email?token=..., /reset-password?token=...).
# The web app uses hash URLs, so end it with "#". Required when mail is on
# and public_base_url is not localhost [APP_BASE_URL]
app_base_url: ""     # e.g. "https://devilapi.github.io/stonerspots/#"

# Leading zero bits of the registration proof-of-work; every extra bit
# doubles the work in the client (18: a fraction of a second on a phone)
# [POW_DIFFICULTY]
pow_difficulty: 18

# true: the admin routes refuse admins who have not set up 2FA (they can
# still reach /admin/2fa to set it up). Set up 2FA for every admin before
# turning it on [REQUIRE_ADMIN_TOTP]
require_admin_totp: false

# MariaDB 11.4 (see schema.example.sql for the table layout).
database:
  host: "127.0.0.1"
  port: 3307
  user: "stonerspots"
  password: "stonerspots"
  name: "stonerspots"
  # Alternatively a complete DSN; when set, the fields above are ignored [DATABASE_URL]
  # url: "user:password@tcp(host:3306)/stonerspots?parseTime=true&multiStatements=true"
