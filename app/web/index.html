<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Stonerspots – community map of chill spots.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101410">
  <meta name="color-scheme" content="dark">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stonerspots">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Stonerspots</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #101410;
      overscroll-behavior: none;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #101410;
      color: #a5d6a7;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      letter-spacing: 0.04em;
      transition: opacity 0.3s ease;
      z-index: 10;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(76, 175, 80, 0.2);
      border-top-color: #4CAF50;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div>Stonerspots</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (!el) return;
      el.classList.add('done');
      setTimeout(function () { el.remove(); }, 400);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // GitHub Pages lets browsers cache index.html for 10 minutes, so a page
    // opened again soon may be an older build. Ask for the deployed build,
    // past every cache, and reload once onto it. CI fills in the build
    // number (tool/web_cache_bust.sh); local builds skip the check.
    (function () {
      const build = '__BUILD_NUMBER__';
      if (!/^[0-9]+$/.test(build)) return;
      fetch('version.json', { cache: 'no-store' })
        .then((r) => r.json())
        .then((v) => {
          const live = String(v.build_number);
          let tried = null;
          try { tried = sessionStorage.getItem('reloadedFor'); } catch (_) {}
          if (live === build || tried === live) return;
          try { sessionStorage.setItem('reloadedFor', live); } catch (_) {}
          location.reload();
        })
        .catch(() => {});
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
