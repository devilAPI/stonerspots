name: Dev build & release

# Every push to main: test, build the backend (Linux amd64/arm64) and the app
# (Android / Linux / Windows / macOS / web / iOS), and publish a
# prerelease tagged dev-<run number> (dev-1, dev-2, ...). Can also be started
# by hand from the Actions tab.
#
# Builds run alongside the tests; only the release waits for both, so nothing
# untested is published. The web build goes to GitHub Pages (/dev/) as soon
# as it and the app tests are done, without waiting for the other builds.
#
# Supply chain: install-backend.sh runs the backend tarball as root on the
# server, so only the backend jobs may produce it. The release takes backend
# files from exactly those artifacts, SHA256SUMS.txt lists only them and is
# signed in a job of its own (sign-backend), and every app artifact is checked
# not to carry a backend-named file. Actions are pinned to commit SHAs
# (Dependabot keeps them current) and every job gets only the permissions it
# needs.
#
# Optional repository settings (Settings -> Secrets and variables -> Actions):
#   secret   API_URL   public HTTPS URL of the backend the builds talk to, e.g.
#                      https://api.example.com/api/v1 (a variable API_URL works too;
#                      default: http://localhost:8080/api/v1). The web build on GitHub
#                      Pages needs HTTPS here and the backend must have
#                      ALLOWED_ORIGINS=https://devilapi.github.io set (CORS).
#                      Database credentials never go here: only the backend uses them.
#   secret   CARTO_KEY CARTO basemaps key for the dark map (without it the app falls
#                      back to OpenStreetMap tiles). The key is compiled into the app.
#   secret   THUNDERFOREST_KEY  Thunderforest key for the public transport map
#                      (without it the app does not offer that map). Compiled in too.
#   secret   RELEASE_SIGNING_KEY  ed25519 private key (OpenSSH format) that signs
#                      SHA256SUMS.txt; servers with the public key refuse unsigned
#                      builds. See README, "Signed releases". Without it the
#                      checksums stay unsigned and the run shows a warning.
#                      It also signs SHA256SUMS-apps.txt (job sign-apps).
#   variable RELEASE_SIGNING_PUBKEY  its public key line (ssh-ed25519 AAAA...),
#                      compiled into the apps: their updater installs only files
#                      listed in a SHA256SUMS-apps.txt signed with it. Without it
#                      the apps only point to the release page. README, "App updates".
#   secrets  ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#            ANDROID_KEY_PASSWORD  the APK signing key (base64 of a .jks). Without
#                      them each APK gets a throwaway debug key and can't be
#                      installed over an earlier one.

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push cancels the running build, so a release always tags the newest
# commit of main. (github.token gets HTTP 403 tagging an older commit whose
# workflow files differ from main's.)
concurrency:
  group: dev-release
  cancel-in-progress: true

permissions: {}

env:
  FLUTTER_VERSION: "3.47.5"
  TAG: dev-${{ github.run_number }}
  BUILD_NUMBER: ${{ github.run_number }}
  API_URL: ${{ secrets.API_URL || vars.API_URL || 'http://localhost:8080/api/v1' }}

jobs:
  test-backend:
    name: Test backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: stonerspots
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      TEST_DATABASE_URL: root:stonerspots@tcp(127.0.0.1:3306)/?parseTime=true&multiStatements=true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Vet and test
        working-directory: backend
        run: |
          go vet ./...
          go test ./...

  test-app:
    name: Test app
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Analyze and test
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # One key for every build, so each APK installs over the previous one
      # (the in-app updater needs that). Without the secrets the APK gets the
      # runner's throwaway debug key and can't update an installed app.
      - name: Android signing key
        working-directory: app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 is not set: the APK is signed with a throwaway debug key and can't be installed over an earlier build (README, \"App updates\")."
            exit 0
          fi
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          } > android/key.properties
      - name: Build APK
        working-directory: app
        env:
          CARTO_KEY: ${{ secrets.CARTO_KEY }}
          THUNDERFOREST_KEY: ${{ secrets.THUNDERFOREST_KEY }}
          RELEASE_SIGNING_PUBKEY: ${{ vars.RELEASE_SIGNING_PUBKEY }}
        run: |
          flutter pub get
          flutter build apk --release \
            --build-number="$BUILD_NUMBER" \
            --dart-define=API_URL="$API_URL" \
            --dart-define=CARTO_KEY="$CARTO_KEY" \
            --dart-define=THUNDERFOREST_KEY="$THUNDERFOREST_KEY" \
            --dart-define=UPDATE_CHANNEL=dev \
            --dart-define=RELEASE_SIGNING_PUBKEY="$RELEASE_SIGNING_PUBKEY"
          rm -f android/key.properties
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk "../dist/stonerspots-${TAG}-android.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-android
          path: dist/*
          if-no-files-found: error

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # cached: a slow Ubuntu mirror once held this step up for 12 minutes
      - name: Install Linux build dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev
          version: 1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build bundle
        working-directory: app
        env:
          CARTO_KEY: ${{ secrets.CARTO_KEY }}
          THUNDERFOREST_KEY: ${{ secrets.THUNDERFOREST_KEY }}
          RELEASE_SIGNING_PUBKEY: ${{ vars.RELEASE_SIGNING_PUBKEY }}
        run: |
          flutter config --enable-linux-desktop
          flutter pub get
          flutter build linux --release \
            --build-number="$BUILD_NUMBER" \
            --dart-define=API_URL="$API_URL" \
            --dart-define=CARTO_KEY="$CARTO_KEY" \
            --dart-define=THUNDERFOREST_KEY="$THUNDERFOREST_KEY" \
            --dart-define=UPDATE_CHANNEL=dev \
            --dart-define=RELEASE_SIGNING_PUBKEY="$RELEASE_SIGNING_PUBKEY"
          mkdir -p ../dist
          tar -czf "../dist/stonerspots-${TAG}-linux-x64.tar.gz" -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-linux
          path: dist/*
          if-no-files-found: error

  build-backend:
    name: Build backend (linux-${{ matrix.arch }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # build provenance (actions/attest-build-provenance)
      id-token: write
      attestations: write
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build static binaries
        working-directory: backend
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          # api reads ./config.yaml and ./migrations from its working directory: run it from the unpacked folder
          name="stonerspots-backend-${TAG}-linux-${GOARCH}"
          mkdir -p "pkg/$name" ../dist
          go build -trimpath -ldflags="-s -w" -o "pkg/$name/api" ./cmd/api
          go build -trimpath -ldflags="-s -w" -o "pkg/$name/makeadmin" ./cmd/makeadmin
          cp -R migrations config.example.yaml schema.example.sql ../install-backend.sh "pkg/$name/"
          tar -czf "../dist/$name.tar.gz" -C pkg "$name"
      # verify with: gh attestation verify <tarball> --repo devilAPI/stonerspots
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/stonerspots-backend-*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-backend-${{ matrix.arch }}
          path: dist/stonerspots-backend-*.tar.gz
          if-no-files-found: error

  # Checksums and signature of the backend tarballs, made from nothing but
  # the two backend artifacts. The signing key is only ever in this job,
  # which runs no third-party code.
  sign-backend:
    name: Sign backend checksums
    needs: [test-backend, build-backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-backend-amd64
          path: backend
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-backend-arm64
          path: backend
      - name: Checksums
        working-directory: backend
        run: |
          set -euo pipefail
          files=("stonerspots-backend-${TAG}-linux-amd64.tar.gz" "stonerspots-backend-${TAG}-linux-arm64.tar.gz")
          if [ "$(ls -A | sort)" != "$(printf '%s\n' "${files[@]}" | sort)" ]; then
            echo "::error::the backend artifacts hold other files than ${files[*]}: $(ls -A | tr '\n' ' ')"
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Sign checksums
        working-directory: backend
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::warning::Secret RELEASE_SIGNING_KEY is not set: SHA256SUMS.txt is published unsigned, and servers with a release-signing.pub will refuse this build (README, \"Signed releases\")."
            exit 0
          fi
          umask 077
          key="$RUNNER_TEMP/release-signing-key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          ssh-keygen -q -Y sign -f "$key" -n stonerspots-release SHA256SUMS.txt
          # check it the way install-backend.sh will
          printf 'stonerspots-release %s\n' "$(ssh-keygen -y -f "$key")" > "$RUNNER_TEMP/allowed_signers"
          ssh-keygen -Y verify -f "$RUNNER_TEMP/allowed_signers" -I stonerspots-release \
            -n stonerspots-release -s SHA256SUMS.txt.sig < SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-checksums
          path: backend/SHA256SUMS.txt*
          if-no-files-found: error

  build-web:
    name: Build web
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build web app
        working-directory: app
        env:
          CARTO_KEY: ${{ secrets.CARTO_KEY }}
          THUNDERFOREST_KEY: ${{ secrets.THUNDERFOREST_KEY }}
        run: |
          # base href stays "/"; the Pages workflow rewrites it for its sub-path
          flutter pub get
          flutter build web --release \
            --build-number="$BUILD_NUMBER" \
            --dart-define=API_URL="$API_URL" \
            --dart-define=CARTO_KEY="$CARTO_KEY" \
            --dart-define=THUNDERFOREST_KEY="$THUNDERFOREST_KEY"
          tool/web_cache_bust.sh build/web "$BUILD_NUMBER"
          mkdir -p ../dist
          (cd build/web && zip -qr "../../../dist/stonerspots-${TAG}-web.zip" .)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-web
          path: dist/*
          if-no-files-found: error

  build-ios:
    name: Build iOS (unsigned)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build app (no code signing)
        working-directory: app
        env:
          CARTO_KEY: ${{ secrets.CARTO_KEY }}
          THUNDERFOREST_KEY: ${{ secrets.THUNDERFOREST_KEY }}
        run: |
          flutter pub get
          flutter build ios --release --no-codesign \
            --build-number="$BUILD_NUMBER" \
            --dart-define=API_URL="$API_URL" \
            --dart-define=CARTO_KEY="$CARTO_KEY" \
            --dart-define=THUNDERFOREST_KEY="$THUNDERFOREST_KEY"
          mkdir -p Payload ../dist
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "../dist/stonerspots-${TAG}-ios-unsigned.ipa" Payload
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-ios
          path: dist/*
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build app
        working-directory: app
        shell: pwsh
        env:
          CARTO_KEY: ${{ secrets.CARTO_KEY }}
          THUNDERFOREST_KEY: ${{ secrets.THUNDERFOREST_KEY }}
          RELEASE_SIGNING_PUBKEY: ${{ vars.RELEASE_SIGNING_PUBKEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release `
            "--build-number=$env:BUILD_NUMBER" `
            "--dart-define=API_URL=$env:API_URL" `
            "--dart-define=CARTO_KEY=$env:CARTO_KEY" `
            "--dart-define=THUNDERFOREST_KEY=$env:THUNDERFOREST_KEY" `
            "--dart-define=UPDATE_CHANNEL=dev" `
            "--dart-define=RELEASE_SIGNING_PUBKEY=$env:RELEASE_SIGNING_PUBKEY"
          New-Item -ItemType Directory -Force ..\dist | Out-Null
          # the folder's contents at the zip's top level, like the Linux tarball
          Compress-Archive -Path build\windows\x64\runner\Release\* `
            -DestinationPath "..\dist\stonerspots-$env:TAG-windows-x64.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-windows
          path: dist/*
          if-no-files-found: error

  build-macos:
    name: Build macOS (ad-hoc signed)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build app
        working-directory: app
        env:
          CARTO_KEY: ${{ secrets.CARTO_KEY }}
          THUNDERFOREST_KEY: ${{ secrets.THUNDERFOREST_KEY }}
          RELEASE_SIGNING_PUBKEY: ${{ vars.RELEASE_SIGNING_PUBKEY }}
        run: |
          flutter config --enable-macos-desktop
          flutter pub get
          flutter build macos --release \
            --build-number="$BUILD_NUMBER" \
            --dart-define=API_URL="$API_URL" \
            --dart-define=CARTO_KEY="$CARTO_KEY" \
            --dart-define=THUNDERFOREST_KEY="$THUNDERFOREST_KEY" \
            --dart-define=UPDATE_CHANNEL=dev \
            --dart-define=RELEASE_SIGNING_PUBKEY="$RELEASE_SIGNING_PUBKEY"
          mkdir -p ../dist
          # -y keeps the framework symlinks as links
          (cd build/macos/Build/Products/Release && zip -qry "$GITHUB_WORKSPACE/dist/stonerspots-${TAG}-macos.zip" Stonerspots.app)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-macos
          path: dist/*
          if-no-files-found: error

  # Checksums and signature of the app files, from nothing but the app
  # artifacts. The in-app updater installs a file only if its hash is in
  # this signed list (same key and namespace as sign-backend).
  sign-apps:
    name: Sign app checksums
    needs: [test-app, build-android, build-linux, build-windows, build-macos, build-web, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-android
          path: apps
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-linux
          path: apps
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-windows
          path: apps
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-macos
          path: apps
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-web
          path: apps
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-ios
          path: apps
      - name: Checksums
        working-directory: apps
        run: |
          set -euo pipefail
          files=(
            "stonerspots-${TAG}-android.apk"
            "stonerspots-${TAG}-linux-x64.tar.gz"
            "stonerspots-${TAG}-windows-x64.zip"
            "stonerspots-${TAG}-macos.zip"
            "stonerspots-${TAG}-web.zip"
            "stonerspots-${TAG}-ios-unsigned.ipa"
          )
          if [ "$(ls -A | sort)" != "$(printf '%s\n' "${files[@]}" | sort)" ]; then
            echo "::error::the app artifacts hold other files than ${files[*]}: $(ls -A | tr '\n' ' ')"
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS-apps.txt
          cat SHA256SUMS-apps.txt
      - name: Sign checksums
        working-directory: apps
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::warning::Secret RELEASE_SIGNING_KEY is not set: SHA256SUMS-apps.txt is published unsigned, and the apps will not install this build themselves (README, \"App updates\")."
            exit 0
          fi
          umask 077
          key="$RUNNER_TEMP/release-signing-key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          ssh-keygen -q -Y sign -f "$key" -n stonerspots-release SHA256SUMS-apps.txt
          printf 'stonerspots-release %s\n' "$(ssh-keygen -y -f "$key")" > "$RUNNER_TEMP/allowed_signers"
          ssh-keygen -Y verify -f "$RUNNER_TEMP/allowed_signers" -I stonerspots-release \
            -n stonerspots-release -s SHA256SUMS-apps.txt.sig < SHA256SUMS-apps.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-checksums
          path: apps/SHA256SUMS-apps.txt*
          if-no-files-found: error

  deploy-web:
    name: Deploy web to /dev/
    needs: [test-app, build-web]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      dev_web_artifact: dist-web

  release:
    name: Publish ${{ github.run_number }} as dev-${{ github.run_number }}
    needs: [test-app, test-backend, build-backend, sign-backend, build-android, build-linux, build-windows, build-macos, build-web, build-ios, sign-apps]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # every artifact into its own folder (no merging): each file is taken
      # only from the job that is supposed to make it
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
      - name: Collect release files
        run: |
          set -euo pipefail
          mkdir dist
          # backend: from its own jobs only, exactly what sign-backend checksummed
          for arch in amd64 arm64; do
            cp "artifacts/dist-backend-${arch}/stonerspots-backend-${TAG}-linux-${arch}.tar.gz" dist/
          done
          cp artifacts/release-checksums/SHA256SUMS.txt* dist/
          (cd dist && sha256sum -c SHA256SUMS.txt)
          # apps: anything but backend files and checksums
          for job in android linux windows macos web ios; do
            for f in "artifacts/dist-${job}"/*; do
              name=$(basename "$f")
              case "$name" in
                stonerspots-backend-* | SHA256SUMS*)
                  echo "::error::artifact dist-${job} contains ${name}, which only the backend jobs may make"
                  exit 1 ;;
              esac
              if [ -e "dist/$name" ]; then
                echo "::error::${name} comes from more than one artifact"
                exit 1
              fi
              cp "$f" dist/
            done
          done
          # checksums of the app files (signed: SHA256SUMS-apps.txt.sig), made
          # by sign-apps; the apps' updater installs nothing they don't cover
          cp artifacts/app-checksums/SHA256SUMS-apps.txt* dist/
          (cd dist && sha256sum -c SHA256SUMS-apps.txt)
          ls -l dist
      - name: Create prerelease
        env:
          # untrusted text: only ever read through the environment
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ANDROID_SIGNED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          short="${GITHUB_SHA::7}"
          apk="signed with the project key"
          [ "$ANDROID_SIGNED" = true ] || apk="signed with a throwaway debug key (it can't update an installed app)"
          notes="Development build ${BUILD_NUMBER} of commit ${short}. Not for production.
          The Android APK is ${apk}. The iOS file is unsigned and must be re-signed before it can be installed; the macOS app is only ad-hoc signed (first start: right-click, Open).
          SHA256SUMS.txt covers the backend tarballs (signed: SHA256SUMS.txt.sig); SHA256SUMS-apps.txt the app files (signed: SHA256SUMS-apps.txt.sig).

          ${COMMIT_MSG}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # re-run of the same workflow run: replace the files
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Dev build ${BUILD_NUMBER} (${short})" \
              --notes "$notes"
          fi
